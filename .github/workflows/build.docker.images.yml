---
name: Build & publish docker images

"on":
  workflow_dispatch:
    inputs:
      softwarebuild:
        type: choice
        required: false
        options:
          - release
          - snapshot
          - compose
        default: "release"

  workflow_call:
    inputs:
      softwarebuild:
        required: true
        type: string

  release:
    types:
      - released
      - prereleased

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_ACCOUNT: ${{ vars.REGISTRY_ACCOUNT }}
  REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
  REGISTRY_REPO_TAG_CACHE_NAME: ${{ vars.REGISTRY_REPO_TAG_CACHE_NAME }}
  REGISTRY_PLATFORMS: ${{ vars.REGISTRY_PLATFORMS }}

  SOFTWARE_BUILD: >-
    ${{ github.event_name == 'release'
        && 'release'
        || inputs.softwarebuild }}


jobs:
  set-variables:
    name: Set-Variables
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Check required configuration
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          missing=0

          for var in \
            REGISTRY \
            REGISTRY_ACCOUNT \
            REGISTRY_REPO \
            REGISTRY_REPO_TAG_CACHE_NAME \
            REGISTRY_PLATFORMS \
            DOCKERHUB_USERNAME \
            DOCKERHUB_TOKEN \
            COSIGN_PRIVATE_KEY \
            COSIGN_PASSWORD
          do
            if [[ -z "${!var}" ]]; then
              echo "::error::Required setting '$var' is missing."
              missing=1
            else
              echo "::notice::Required setting '$var' is configured."
            fi
          done

          exit $missing


  setup-build-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs:
      - set-variables

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0

      - name: Load selfoss.${{ env.SOFTWARE_BUILD }} file
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        id: selfoss
        run: |
          set -a
          source selfoss.${{ env.SOFTWARE_BUILD }}
          set +a

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SHA256_HASH=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "APP_DL_PATH=$URL" >> $GITHUB_OUTPUT

      - name: Display vars from selfoss.${{ env.SOFTWARE_BUILD }} file
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        run: |
          echo "Version: ${{ steps.selfoss.outputs.VERSION }}"
          echo "Hash: ${{ steps.selfoss.outputs.SHA256_HASH }}"
          echo "URL: ${{ steps.selfoss.outputs.APP_DL_PATH }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create tag list for docker image
        id: tags
        env:
          REGISTRY_ACCOUNT: ${{ env.REGISTRY_ACCOUNT }}
          REGISTRY_REPO: ${{ env.REGISTRY_REPO }}
          SOFTWARE_BUILD: ${{ env.SOFTWARE_BUILD }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          SELFOSS_VERSION: ${{ steps.selfoss.outputs.VERSION }}
        run: |
          container_tag="${GITHUB_REF_NAME##*/}"

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            image_tag="$container_tag"
          elif [[ -n "$RELEASE_TAG_NAME" ]]; then
            image_tag="$RELEASE_TAG_NAME"
          elif [[ "$SOFTWARE_BUILD" == "snapshot" ]]; then
            image_tag="$SELFOSS_VERSION"
          elif [[ "$SOFTWARE_BUILD" == "compose" ]]; then
            image_tag="master-compose"

          else
            image_tag="$container_tag"
          fi

          echo "docker=${REGISTRY_ACCOUNT}/${REGISTRY_REPO}:${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push (release, snapshot)
        id: build-release
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_FILE_HASH=${{ steps.selfoss.outputs.SHA256_HASH }}
            APP_DL_PATH=${{ steps.selfoss.outputs.APP_DL_PATH }}
          tags: ${{ steps.tags.outputs.docker }}
          platforms: ${{ env.REGISTRY_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }},mode=max
          sbom: true
          provenance: mode=max

      - name: Build and push (compose)
        id: build-compose
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        if: env.SOFTWARE_BUILD == 'compose'
        with:
          context: .
          file: Dockerfile.compose
          push: true
          tags: ${{ steps.tags.outputs.docker }}
          platforms: ${{ env.REGISTRY_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }},mode=max
          sbom: true
          provenance: mode=max

      - name: Select build digest
        id: build
        shell: bash
        env:
          SOFTWARE_BUILD: ${{ env.SOFTWARE_BUILD }}
          RELEASE_DIGEST: ${{ steps.build-release.outputs.digest }}
          COMPOSE_DIGEST: ${{ steps.build-compose.outputs.digest }}
        run: |
          case "$SOFTWARE_BUILD" in
            compose)
              digest="$COMPOSE_DIGEST"
              ;;
            release|snapshot)
              digest="$RELEASE_DIGEST"
              ;;
            *)
              echo "::error::Unsupported software build '$SOFTWARE_BUILD'."
              exit 1
              ;;
          esac

          if [[ -z "$digest" ]]; then
            echo "::error::The image build did not produce a digest."
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Show Cosign version
        shell: bash
        run: |
          cosign version

      - name: Sign docker image with a key
        shell: bash
        run: |
          cosign sign \
            --verbose \
            --new-bundle-format=true \
            --use-signing-config=false \
            --yes \
            --key env://COSIGN_PRIVATE_KEY ${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Verify image signature
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}"

          for i in {1..12}; do
            echo "Verification attempt ${i}/12..."

            if cosign verify \
                --key cosign.pub \
                --output text \
                "${IMAGE}"; then
              echo "Signature verified."

              exit 0
            fi

            echo "Signature not yet available. Waiting 5 seconds..."
            sleep 5
          done

          echo "ERROR: Signature could not be verified after 60 seconds."
          exit 1

      - name: Show Cosign artifact tree
        shell: bash
        run: |
          cosign tree ${{ env.REGISTRY }}/${{ steps.tags.outputs.docker }}@${{ steps.build.outputs.digest }}


      - name: Promote image to latest
        if: github.event_name == 'release' && github.event.action == 'released' && github.event.release.prerelease == false && github.event.release.draft == false
        shell: bash
        run: |
          # Create or update the "latest" tag to point to the newly released image version.
          # This operation updates the manifest in the registry and preserves all platform variants.
          docker buildx imagetools create -t "${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:latest" ${{ steps.tags.outputs.docker }}

      - name: Update Docker Repository Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        if: env.SOFTWARE_BUILD == 'release'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}
          readme-filepath: ./DOCKERHUB.md
          short-description: "The ultimate multi-purpose RSS reader, data stream, mash-up, aggregation web application"
