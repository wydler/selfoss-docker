---
name: Build & publish docker images

"on":
  workflow_dispatch:
    inputs:
      softwarebuild:
        type: choice
        required: false
        options:
          - release
          - snapshot
          - compose
        default: "release"

  workflow_call:
    inputs:
      softwarebuild:
        required: true
        type: string

  release:
    types:
      - released
      - prereleased

permissions:
  contents: read

env:
  REGISTRY: ${{ vars.REGISTRY }}
  REGISTRY_ACCOUNT: ${{ vars.REGISTRY_ACCOUNT }}
  REGISTRY_REPO: ${{ vars.REGISTRY_REPO }}
  REGISTRY_REPO_TAG_CACHE_NAME: ${{ vars.REGISTRY_REPO_TAG_CACHE_NAME }}
  REGISTRY_PLATFORMS: ${{ vars.REGISTRY_PLATFORMS }}

  SOFTWARE_BUILD: ${{ inputs.softwarebuild }}

jobs:
  set-variables:
    name: Set-Variables
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - name: Check required variables
        shell: bash
        run: |
          missing=0

          for var in \
            REGISTRY \
            REGISTRY_ACCOUNT \
            REGISTRY_REPO \
            REGISTRY_REPO_TAG_CACHE_NAME \
            REGISTRY_PLATFORMS
          do
            if [[ -z "${!var}" ]]; then
              echo "::error::Repository variable '$var' is missing."
              missing=1
            else
              echo "::notice::$var is configured."
            fi
          done

          exit $missing

  setup-build-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs:
      - set-variables

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: "${{ github.ref_name }}"
          fetch-depth: 0

      - name: Load selfoss.${{ env.SOFTWARE_BUILD }} file
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        id: selfoss
        run: |
          set -a
          source selfoss.${{ env.SOFTWARE_BUILD }}
          set +a

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "SHA256_HASH=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "APP_DL_PATH=$URL" >> $GITHUB_OUTPUT

      - name: Display vars from selfoss.${{ env.SOFTWARE_BUILD }} file
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        run: |
          echo "Version: ${{ steps.selfoss.outputs.VERSION }}"
          echo "Hash: ${{ steps.selfoss.outputs.SHA256_HASH }}"
          echo "URL: ${{ steps.selfoss.outputs.APP_DL_PATH }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create tag list for docker image
        id: tags
        run: |
          # basename does remove the directory prefix of a path
          # https://stackoverflow.com/questions/3294072/get-last-dirname-filename-in-a-file-path-argument-in-bash
          container_tag=$(basename ${{ github.ref_name }})
          echo $container_tag

          if [ "${{ github.event.release.prerelease }}" = true ]; then
            echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:$container_tag" >> $GITHUB_OUTPUT

          elif [ ! -z "${{ github.event.release.tag_name }}" ]; then
            echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:latest, ${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

          elif [ "${{ env.SOFTWARE_BUILD }}" == "snapshot" ]; then
            echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ steps.selfoss.outputs.VERSION }}" >> $GITHUB_OUTPUT

          elif [ "${{ env.SOFTWARE_BUILD }}" == "compose" ]; then
            echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:master-compose" >> $GITHUB_OUTPUT

          else
            echo "docker=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:$container_tag" >> $GITHUB_OUTPUT

          fi

      - name: Build and push (release, snapshot)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        if: env.SOFTWARE_BUILD == 'release' || env.SOFTWARE_BUILD == 'snapshot'
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_FILE_HASH=${{ steps.selfoss.outputs.SHA256_HASH }}
            APP_DL_PATH=${{ steps.selfoss.outputs.APP_DL_PATH }}
          tags: ${{ steps.tags.outputs.docker }}
          platforms: ${{ env.REGISTRY_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }},mode=max

      - name: Build and push (compose)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        if: env.SOFTWARE_BUILD == 'compose'
        with:
          context: .
          file: Dockerfile.compose
          push: true
          tags: ${{ steps.tags.outputs.docker }}
          platforms: ${{ env.REGISTRY_PLATFORMS }}
          cache-from: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }}
          cache-to: type=registry,ref=${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}:${{ env.REGISTRY_REPO_TAG_CACHE_NAME }},mode=max

      - name: Update Docker Repository Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa  # v5.0.0
        if: env.SOFTWARE_BUILD == 'release'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_ACCOUNT }}/${{ env.REGISTRY_REPO }}
          readme-filepath: ./README-dockerhub.md
          short-description: "The ultimate multi-purpose RSS reader, data stream, mash-up, aggregation web application"
